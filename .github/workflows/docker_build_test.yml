name: docker_build_test

on:
  pull_request:
  push:
    branches:
      - main

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  docker-build-rocky8:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db_backend: [sqlite, postgres]
    env:
      # Override docker run options for non-interactive CI
      # Papiex Makefile default is "--rm -it", but -it causes "not a TTY" error
      # Keep --rm for cleanup, remove -it for non-interactive mode
      DOCKER_RUN_OPTS: "--rm"
      OS_TARGET: "rocky-8"
      # Values from giovtorres/slurm-docker-cluster .env file
      # docker build does not read .env files (only docker-compose does),
      # so we define these here and pass SLURM_TAG as --build-arg
      SLURM_TAG: "slurm-25-05-3-1"
      IMAGE_TAG: "25.05.3"
      SLURM_CLUSTER_TAG: "0.9.0"
      # Build environment versions (must match Makefile)
      PYTHON_VERSION: "3.9.25"  # updated from 3.9.22 (issue #153: use latest 3.9.x)
      SQLITE_VERSION: "3490100"
      SQLITE_YEAR: "2025"
      # Tarball source identifiers — must match Makefile and weekly_tarball_build.yml
      PAPIEX_VERSION: "2.3.16"
      EPMT_DASH_SRC_BRANCH: "main"

    steps:
      - uses: actions/checkout@v4

      - name: Extract build variables
        run: |
          EPMT_VERSION=$(sed -n '/_version = /p' src/epmt/epmtlib.py | sed 's/ //g; s/,/./g; s/.*(\(.*\))/\1/')
          echo "EPMT_VERSION=${EPMT_VERSION}" >> $GITHUB_ENV
          echo "EPMT_FULL_RELEASE=EPMT-release-${EPMT_VERSION}-${OS_TARGET}.tgz" >> $GITHUB_ENV
          echo "EPMT_PYTHON_FULL_RELEASE=epmt-${EPMT_VERSION}.tar.gz" >> $GITHUB_ENV
          echo "EPMT_INSTALL_PATH=/opt/minimalmetrics" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use docker driver to store images in local daemon.
          # The docker driver uses BuildKit internally (default in modern Docker)
          # and supports --cache-from with inline cache metadata.
          driver: docker

      - name: Check Cache for slurm-cluster image
        id: cache-slurm
        uses: actions/cache@v4
        with:
          path: /tmp/slurm-cluster-image.tar
          key: slurm-cluster-${{ env.IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}

      - name: Load cached slurm-cluster image
        if: steps.cache-slurm.outputs.cache-hit == 'true'
        run: docker load -i /tmp/slurm-cluster-image.tar

      - name: Build slurm-cluster base image
        if: steps.cache-slurm.outputs.cache-hit != 'true'
        run: |
          # The rocky-8-epmt-test-release Dockerfile expects a slurm-cluster image.
          # Build it from giovtorres/slurm-docker-cluster (Rocky Linux 8 based).
          # Pass SLURM_TAG as --build-arg since docker build does not read .env files.
          set -e
          git clone --branch ${{ env.SLURM_CLUSTER_TAG }} --depth 1 https://github.com/giovtorres/slurm-docker-cluster.git /tmp/slurm-docker-cluster
          docker build --progress=plain --build-arg SLURM_TAG=${SLURM_TAG} -t slurm-cluster:${IMAGE_TAG} /tmp/slurm-docker-cluster

      # this only runs for the main branch
      - name: Save slurm-cluster image for caching
        if: steps.cache-slurm.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: docker save slurm-cluster:${IMAGE_TAG} -o /tmp/slurm-cluster-image.tar

      - name: Verify slurm-cluster image exists
        run: |
          if ! docker image inspect slurm-cluster:${IMAGE_TAG} > /dev/null 2>&1; then
            echo "::error::Docker image 'slurm-cluster:${IMAGE_TAG}' was not built."
            exit 1
          fi
          echo "Image 'slurm-cluster:${IMAGE_TAG}' exists."

      - name: Clean all
        run: make --debug OS_TARGET=${OS_TARGET} clean-all

      # ── epmt-dash tarball: cached across runs ──────────────────────────────
      # Cache key: branch name.  Update EPMT_DASH_SRC_BRANCH (env + Makefile)
      # to invalidate.  The weekly_tarball_build workflow pre-warms this cache
      # every Monday; the build below is a fallback for cache misses.
      # clean-all does not remove src/epmt/ui, so a restored cache survives it.
      - name: Check Cache for epmt-dash
        id: cache-epmt-dash
        uses: actions/cache@v4
        with:
          path: src/epmt/ui
          key: epmt-dash-${{ env.EPMT_DASH_SRC_BRANCH }}

      - name: Build epmt-dash
        if: steps.cache-epmt-dash.outputs.cache-hit != 'true'
        run: make --debug OS_TARGET=${OS_TARGET} epmt-dash

      - name: Verify epmt-dash directory exists
        run: |
          if [ ! -d "src/epmt/ui" ]; then
            echo "::error::src/epmt/ui not found after epmt-dash step."
            exit 1
          fi
          echo "src/epmt/ui exists."

      # ── papiex tarball: cached across runs ────────────────────────────────
      # Cache key: version + OS target.  Update PAPIEX_VERSION (env + Makefile)
      # to invalidate.  The weekly_tarball_build workflow pre-warms this cache
      # every Monday; the build below is a fallback for cache misses.
      # clean-all does not remove papiex-epmt-*.tgz, so a restored cache
      # survives it.
      - name: Check Cache for papiex tarball
        id: cache-papiex
        uses: actions/cache@v4
        with:
          path: papiex-epmt-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}.tgz
          key: papiex-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}

      - name: Build papiex-dist
        if: steps.cache-papiex.outputs.cache-hit != 'true'
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Verify papiex tarball exists
        run: |
          TARBALL="papiex-epmt-${PAPIEX_VERSION}-${OS_TARGET}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Papiex tarball '${TARBALL}' not found."
            exit 1
          fi
          echo "Papiex tarball '${TARBALL}' exists."

      # ── epmt-build image: cached across runs ──
      # This image contains the build environment (OS packages, sqlite, Python,
      # pip deps) but NOT epmt code.  It only changes when the Dockerfile or
      # requirements change, so we cache the full image via docker save/load.
      - name: Check Cache for epmt-build image
        id: cache-epmt-build
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: /tmp/epmt-build-image.tar
          key: epmt-build-${{ env.OS_TARGET }}-py${{ env.PYTHON_VERSION }}-sqlite${{ env.SQLITE_VERSION }}-${{ hashFiles('Dockerfiles/Dockerfile.rocky-8-epmt-build', 'requirements.txt.py3') }}

      - name: Load cached epmt-build image
        if: steps.cache-epmt-build.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/epmt-build-image.tar
          # Re-tag if EPMT_VERSION changed (the image content is version-independent)
          LOADED=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'epmt-build' | head -1)
          if [ -n "$LOADED" ] && [ "$LOADED" != "${OS_TARGET}-epmt-build:${EPMT_VERSION}" ]; then
            docker tag "$LOADED" "${OS_TARGET}-epmt-build:${EPMT_VERSION}"
          fi

      - name: Build epmt-build image
        if: steps.cache-epmt-build.outputs.cache-hit != 'true'
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f Dockerfiles/Dockerfile.${OS_TARGET}-epmt-build \
            -t ${OS_TARGET}-epmt-build:${EPMT_VERSION} \
            --build-arg sqlite_version=${SQLITE_VERSION} \
            --build-arg sqlite_year=${SQLITE_YEAR} \
            --build-arg python_version=${PYTHON_VERSION} .

      # this only runs for the main branch
      - name: Save epmt-build image for caching
        if: steps.cache-epmt-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: docker save ${OS_TARGET}-epmt-build:${EPMT_VERSION} -o /tmp/epmt-build-image.tar

      - name: Verify epmt-build image exists
        run: |
          if ! docker image inspect ${OS_TARGET}-epmt-build:${EPMT_VERSION} > /dev/null 2>&1; then
            echo "::error::Docker image '${OS_TARGET}-epmt-build:${EPMT_VERSION}' not found."
            exit 1
          fi

      # Run the actual epmt build inside the (now cached) build image.
      # This replaces the docker-run half of `make docker-dist`.
      - name: Build epmt artifacts in container
        run: |
          docker run ${DOCKER_RUN_OPTS} --privileged \
            --volume=$(pwd):$(pwd) -w $(pwd) \
            ${OS_TARGET}-epmt-build:${EPMT_VERSION} \
            make --debug OS_TARGET=${OS_TARGET} dist python-dist dist-test

      - name: Build epmt-full-release
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" epmt-full-release

      # ── test-release image: layer-cached across runs via --cache-from ──
      # This image changes every commit (new EPMT artifacts baked in), so we
      # can't skip the build.  But the expensive early layers (yum, sqlite,
      # Python, pip install) are identical across commits.  We cache the
      # previous run's image and feed it to --cache-from so BuildKit reuses
      # those layers instead of rebuilding them from scratch.
      - name: Check Cache for test-release image
        id: cache-test-release
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: /tmp/test-release-image.tar
          key: test-release-${{ env.OS_TARGET }}-py${{ env.PYTHON_VERSION }}-sqlite${{ env.SQLITE_VERSION }}-${{ hashFiles('Dockerfiles/Dockerfile.rocky-8-epmt-test-release', 'requirements.txt.py3') }}-${{ github.sha }}
          restore-keys: |
            test-release-${{ env.OS_TARGET }}-py${{ env.PYTHON_VERSION }}-sqlite${{ env.SQLITE_VERSION }}-${{ hashFiles('Dockerfiles/Dockerfile.rocky-8-epmt-test-release', 'requirements.txt.py3') }}-

      - name: Load cached test-release image for layer reuse
        run: |
          if [ -f /tmp/test-release-image.tar ]; then
            docker load -i /tmp/test-release-image.tar || true
            # Tag with a fixed name so --cache-from can reference it
            # regardless of what version was in the previously cached image
            LOADED=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'epmt-test-release' | head -1)
            if [ -n "$LOADED" ]; then
              docker tag "$LOADED" epmt-test-release-cache:latest
              echo "Loaded cached image ${LOADED} as epmt-test-release-cache:latest"
            fi
          else
            echo "No cached test-release image found, building from scratch"
          fi

      - name: Build check-release image
        run: |
          CACHE_FROM=""
          if docker image inspect epmt-test-release-cache:latest > /dev/null 2>&1; then
            CACHE_FROM="--cache-from epmt-test-release-cache:latest"
            echo "Using cached layers from previous test-release image"
          fi
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            ${CACHE_FROM} \
            -f Dockerfiles/Dockerfile.${OS_TARGET}-epmt-test-release \
            -t ${OS_TARGET}-epmt-test-release:${EPMT_VERSION} \
            --build-arg epmt_version=${EPMT_VERSION} \
            --build-arg install_path=${EPMT_INSTALL_PATH} \
            --build-arg epmt_full_release=${EPMT_FULL_RELEASE} \
            --build-arg epmt_python_full_release=${EPMT_PYTHON_FULL_RELEASE} \
            --build-arg sqlite_version=${SQLITE_VERSION} \
            --build-arg sqlite_year=${SQLITE_YEAR} \
            --build-arg python_version=${PYTHON_VERSION} .

      # this only runs for main
      - name: Save test-release image for caching
        if: github.ref == 'refs/heads/main'
        run: docker save ${OS_TARGET}-epmt-test-release:${EPMT_VERSION} -o /tmp/test-release-image.tar

      - name: Verify check-release image exists
        run: |
          IMAGE="${OS_TARGET}-epmt-test-release:${EPMT_VERSION}"
          echo "Checking for Docker image: ${IMAGE}"
          if ! docker image inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "::error::Docker image '${IMAGE}' was not built. The build-check-release step likely failed silently."
            exit 1
          fi
          echo "Image '${IMAGE}' exists."

      - name: Set up check-release test infrastructure
        run: |
          CONTAINER_NAME="${OS_TARGET}-epmt-${EPMT_VERSION}-test-release-${{ matrix.db_backend }}"
          IMAGE_NAME="${OS_TARGET}-epmt-test-release:${EPMT_VERSION}"
          echo "CONTAINER_NAME=${CONTAINER_NAME}" >> $GITHUB_ENV

          # Clean up any previous resources
          if docker ps --filter "name=^postgres-test$" --format '{{.Names}}' | grep -q .; then docker stop postgres-test; fi
          if docker network ls --filter "name=^epmt-test-net$" --format '{{.Name}}' | grep -q .; then docker network rm -f epmt-test-net; fi

          # Create docker network
          docker network create epmt-test-net

          # Start postgres container (only for postgres backend)
          if [ "${{ matrix.db_backend }}" = "postgres" ]; then
            docker run -d --rm --name postgres-test --network epmt-test-net --privileged \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=example \
              -e POSTGRES_DB=EPMT-TEST postgres:latest
          fi

          # Remove any leftover test container (sleep allows Docker to finish cleanup)
          if docker container ls -a --filter "name=^${CONTAINER_NAME}$" --format '{{.Names}}' | grep -q .; then
            docker container rm ${CONTAINER_NAME} || true
            sleep 2
          fi

          # Start test container in detached mode
          docker run -d --name ${CONTAINER_NAME} \
            --network epmt-test-net \
            --privileged \
            -h slurmctl ${IMAGE_NAME} \
            bash -c 'echo 2 > /proc/sys/kernel/perf_event_paranoid && sleep infinity'

      - name: Wait for PostgreSQL to be ready
        if: matrix.db_backend == 'postgres'
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 30); do
            if docker exec postgres-test pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "ERROR: PostgreSQL did not become ready in time"
          exit 1

      - name: Configure epmt to use PostgreSQL
        if: matrix.db_backend == 'postgres'
        run: |
          docker exec -i ${{ env.CONTAINER_NAME }} tee /usr/lib/python3.9/site-packages/epmt/settings.py > /dev/null << 'EOFSETTINGS'
          def test_settings_import():
              pass

          orm = "sqlalchemy"
          db_params = {"url": "postgresql://postgres:example@postgres-test:5432/EPMT-TEST", "echo": False}
          bulk_insert = True
          epmt_settings_kind = "test_pg_container"
          EOFSETTINGS
          echo "PostgreSQL settings installed:"
          docker exec ${{ env.CONTAINER_NAME }} cat /usr/lib/python3.9/site-packages/epmt/settings.py

      - name: epmt version
        run: docker exec ${{ env.CONTAINER_NAME }} epmt -vv -V

      - name: epmt check
        run: docker exec ${{ env.CONTAINER_NAME }} epmt -vv check

      - name: pip install pytest
        run: docker exec ${{ env.CONTAINER_NAME }} pip3 install pytest

      - name: Start SLURM daemons for integration tests
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            set -e
            HOSTNAME=$(hostname)
            CPUS=$(nproc)

            # Override the multi-node docker-compose slurm.conf with a
            # single-node configuration that runs inside this container.
            cat > /etc/slurm/slurm.conf << EOFSLURM
          ClusterName=linux
          SlurmctldHost=${HOSTNAME}
          MpiDefault=none
          ProctrackType=proctrack/linuxproc
          ReturnToService=2
          SlurmctldPidFile=/var/run/slurmd/slurmctld.pid
          SlurmctldPort=6817
          SlurmdPidFile=/var/run/slurmd/slurmd.pid
          SlurmdPort=6818
          SlurmdSpoolDir=/var/spool/slurmd
          SlurmUser=root
          StateSaveLocation=/var/lib/slurmd
          SwitchType=switch/none
          TaskPlugin=task/none
          InactiveLimit=0
          KillWait=30
          MinJobAge=300
          SlurmctldTimeout=300
          SlurmdTimeout=300
          Waittime=0
          SchedulerType=sched/backfill
          SelectType=select/cons_tres
          SelectTypeParameters=CR_Core
          AccountingStorageType=accounting_storage/none
          SlurmctldDebug=info
          SlurmctldLogFile=/var/log/slurm/slurmctld.log
          SlurmdDebug=info
          SlurmdLogFile=/var/log/slurm/slurmd.log
          NodeName=${HOSTNAME} CPUs=${CPUS} RealMemory=1000 State=UNKNOWN
          PartitionName=normal Nodes=ALL Default=YES MaxTime=INFINITE State=UP
          EOFSLURM

            # Disable cgroup plugin — the Docker container lacks cgroup/v2
            # support (the cgroup_v2.so plugin is not shipped in the
            # slurm-cluster base image).  Per the official SLURM docs
            # (https://slurm.schedmd.com/cgroup.conf.html), setting
            # CgroupPlugin=disabled completely disables cgroup interaction.
            # IgnoreSystemd=yes avoids dbus calls since the container has
            # no running systemd.
            cat > /etc/slurm/cgroup.conf << EOFCGROUP
          CgroupPlugin=disabled
          IgnoreSystemd=yes
          EOFCGROUP

            # Ensure required directories exist
            mkdir -p /var/spool/slurmd /var/lib/slurmd /var/log/slurm /var/run/slurmd

            # Start munge authentication daemon
            gosu munge /usr/sbin/munged

            # Start SLURM controller (with -i to ignore stale state files)
            /usr/sbin/slurmctld -i

            # Start SLURM compute node daemon
            /usr/sbin/slurmd

            # Wait for SLURM node to register and become idle.
            # ReturnToService=2 in slurm.conf handles the UNKNOWN->IDLE
            # transition automatically once slurmd registers with slurmctld.
            for i in $(seq 1 60); do
              STATE=$(sinfo -N --noheader -o "%T" 2>/dev/null | head -1)
              if [ "$STATE" = "idle" ]; then
                echo "SLURM is ready (node idle):"
                sinfo
                sinfo -N
                exit 0
              fi
              sleep 1
            done
            echo "ERROR: SLURM node did not reach idle state"
            sinfo -N 2>/dev/null || true
            scontrol show node 2>/dev/null || true
            cat /var/log/slurm/slurmctld.log 2>/dev/null | tail -30 || true
            cat /var/log/slurm/slurmd.log 2>/dev/null | tail -30 || true
            exit 1
          '

      - name: integration, slurm
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_slurm.py'

      - name: SLURM diagnostics (on failure)
        if: failure()
        run: |
          docker exec ${{ env.CONTAINER_NAME }} bash -c '
            echo "=== SLURM job output files ==="
            for f in /tmp/slurm-*.out; do
              [ -f "$f" ] && echo "--- $f ---" && cat "$f" && echo
            done
            echo "=== slurmctld log (last 50 lines) ==="
            tail -50 /var/log/slurm/slurmctld.log 2>/dev/null || true
            echo "=== slurmd log (last 50 lines) ==="
            tail -50 /var/log/slurm/slurmd.log 2>/dev/null || true
            echo "=== squeue ==="
            squeue -l 2>/dev/null || true
            echo "=== sacct ==="
            sacct -l 2>/dev/null || true
          '

      - name: test_anysh
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_anysh.py'

      - name: test_check
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_check.py'

      - name: test_cmds
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_cmds.py'

      - name: test_db_migration
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_db_migration.py'

      - name: test_db_schema
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_db_schema.py'

      - name: test_explore
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_explore.py'

      - name: test_lib
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_lib.py'

      - name: test_outliers
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_outliers.py'

      - name: test_query
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_query.py'

      - name: test_run
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_run.py'

      - name: test_settings
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_settings.py'

      - name: test_shell
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_shell.py'

      - name: test_stat
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_stat.py'

      - name: test_submit
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/test_submit.py'

      - name: integration, basic
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_basic.py'

      - name: integration, escape
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_escape.py'

      - name: integration, concat
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_concat.py'

      - name: integration, daemon
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_daemon.py'

      - name: integration, shell
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_shell.py'

      - name: integration, annotate
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd $(python3 -c "import site; print(site.getsitepackages()[0])") && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_annotate.py'

      - name: integration, explore
