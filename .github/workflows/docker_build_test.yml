name: docker_build_test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly rebuild on Mondays at 6am UTC to verify SLURM image can still be built
    - cron: '0 6 * * 1'

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  docker-build-rocky8:
    runs-on: ubuntu-latest
    env:
      # Override docker run options for non-interactive CI
      # Papiex Makefile default is "--rm -it", but -it causes "not a TTY" error
      # Keep --rm for cleanup, remove -it for non-interactive mode
      DOCKER_RUN_OPTS: "--rm"
      OS_TARGET: "rocky-8"
      # Values from giovtorres/slurm-docker-cluster .env file
      # docker build does not read .env files (only docker-compose does),
      # so we define these here and pass SLURM_TAG as --build-arg
      SLURM_TAG: "slurm-25-05-3-1"
      IMAGE_TAG: "25.05.3"
      SLURM_CLUSTER_TAG: "0.9.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use docker driver to store images in local daemon
          # (docker-container driver requires --load and may not propagate errors)
          driver: docker

      - name: Cache slurm-cluster image
        id: cache-slurm
        # Scheduled runs skip the cache to verify the image can still be built from source
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: /tmp/slurm-cluster-image.tar
          key: slurm-cluster-${{ env.IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}

      - name: Load cached slurm-cluster image
        if: steps.cache-slurm.outputs.cache-hit == 'true'
        run: docker load -i /tmp/slurm-cluster-image.tar

      - name: Build slurm-cluster base image
        if: steps.cache-slurm.outputs.cache-hit != 'true'
        run: |
          # The rocky-8-epmt-test-release Dockerfile expects a slurm-cluster image.
          # Build it from giovtorres/slurm-docker-cluster (Rocky Linux 8 based).
          # Pass SLURM_TAG as --build-arg since docker build does not read .env files.
          set -e
          git clone --branch ${{ env.SLURM_CLUSTER_TAG }} --depth 1 https://github.com/giovtorres/slurm-docker-cluster.git /tmp/slurm-docker-cluster
          docker build --progress=plain --build-arg SLURM_TAG=${SLURM_TAG} -t slurm-cluster:${IMAGE_TAG} /tmp/slurm-docker-cluster

      - name: Save slurm-cluster image for caching
        if: steps.cache-slurm.outputs.cache-hit != 'true'
        run: docker save slurm-cluster:${IMAGE_TAG} -o /tmp/slurm-cluster-image.tar

      - name: Verify slurm-cluster image exists
        run: |
          if ! docker image inspect slurm-cluster:${IMAGE_TAG} > /dev/null 2>&1; then
            echo "::error::Docker image 'slurm-cluster:${IMAGE_TAG}' was not built."
            exit 1
          fi
          echo "Image 'slurm-cluster:${IMAGE_TAG}' exists."

      - name: Clean all
        run: make --debug OS_TARGET=${OS_TARGET} clean-all

      - name: Build epmt-dash
        run: make --debug OS_TARGET=${OS_TARGET} epmt-dash

      - name: Build papiex-dist
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Build docker-dist
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" docker-dist

      - name: Build epmt-full-release
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" epmt-full-release

      - name: Build check-release image
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" build-check-release

      - name: Verify check-release image exists
        run: |
          # Extract EPMT_VERSION using the same sed logic as the Makefile (line 44)
          EPMT_VERSION=$(sed -n '/_version = /p' src/epmt/epmtlib.py | sed 's/ //g; s/,/./g; s/.*(\(.*\))/\1/')
          IMAGE="${OS_TARGET}-epmt-test-release:${EPMT_VERSION}"
          echo "Checking for Docker image: ${IMAGE}"
          if ! docker image inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "::error::Docker image '${IMAGE}' was not built. The build-check-release step likely failed silently."
            exit 1
          fi
          echo "Image '${IMAGE}' exists."

      - name: Set up check-release test infrastructure
        run: |
          # Extract EPMT_VERSION using the same sed logic as the Makefile
          EPMT_VERSION=$(sed -n '/_version = /p' src/epmt/epmtlib.py | sed 's/ //g; s/,/./g; s/.*(\(.*\))/\1/')
          CONTAINER_NAME="${OS_TARGET}-epmt-${EPMT_VERSION}-test-release"
          IMAGE_NAME="${OS_TARGET}-epmt-test-release:${EPMT_VERSION}"
          echo "EPMT_VERSION=${EPMT_VERSION}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=${CONTAINER_NAME}" >> $GITHUB_ENV

          # Clean up any previous resources
          if docker ps --filter "name=^postgres-test$" --format '{{.Names}}' | grep -q .; then docker stop postgres-test; fi
          if docker network ls --filter "name=^epmt-test-net$" --format '{{.Name}}' | grep -q .; then docker network rm -f epmt-test-net; fi

          # Create docker network
          docker network create epmt-test-net

          # Start postgres container
          docker run -d --rm --name postgres-test --network epmt-test-net --privileged \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=example \
            -e POSTGRES_DB=EPMT-TEST postgres:latest

          # Remove any leftover test container (sleep allows Docker to finish cleanup)
          if docker container ls -a --filter "name=^${CONTAINER_NAME}$" --format '{{.Names}}' | grep -q .; then
            docker container rm ${CONTAINER_NAME} || true
            sleep 2
          fi

          # Start test container in detached mode
          docker run -d --name ${CONTAINER_NAME} \
            --network epmt-test-net \
            --privileged \
            -h slurmctl ${IMAGE_NAME} \
            bash -c 'echo 2 > /proc/sys/kernel/perf_event_paranoid && sleep infinity'

      - name: epmt version
        run: docker exec ${{ env.CONTAINER_NAME }} epmt -vv -V

      - name: epmt check
        run: docker exec ${{ env.CONTAINER_NAME }} epmt -vv check

      - name: pip install pytest
        run: docker exec ${{ env.CONTAINER_NAME }} pip3 install pytest

      - name: test_anysh (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_anysh.py'

      - name: test_check
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_check.py'

      - name: test_cmds
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_cmds.py'

      - name: test_db_migration
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_db_migration.py'

      - name: test_db_schema
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_db_schema.py'

      - name: test_explore
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_explore.py'

      - name: test_lib
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_lib.py'

      - name: test_outliers
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_outliers.py'

      - name: test_query
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_query.py'

      - name: test_run (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_run.py'

      - name: test_settings
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_settings.py'

      - name: test_shell
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_shell.py'

      - name: test_stat
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_stat.py'

      - name: test_submit
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/test_submit.py'

      - name: integration, basic (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_basic.py'

      - name: integration, escape (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_escape.py'

      - name: integration, concat
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_concat.py'

      - name: integration, daemon
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_daemon.py'

      - name: integration, shell
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_shell.py'

      - name: integration, annotate (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_annotate.py'

      - name: integration, explore (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_explore.py'

      - name: integration, slurm (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_slurm.py'

      - name: integration, collate-tsv (GUARDED)
        continue-on-error: true
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_collate_tsv.py'

      - name: integration, kernel-compile
        run: docker exec ${{ env.CONTAINER_NAME }} bash -c 'cd /usr/lib/python3.9/site-packages && TZ=UTC pytest -x -vv epmt/test/integration/test_integration_kernel_compile.py'

      - name: Clean up test infrastructure
        if: always()
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker stop postgres-test || true
          docker network rm epmt-test-net || true
