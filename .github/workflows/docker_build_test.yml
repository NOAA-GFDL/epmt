name: docker_build_test

on:
  pull_request:
  push:
    branches:
      - main

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  docker-build-rocky8:
    runs-on: ubuntu-latest
    env:
      # Override docker run options for non-interactive CI
      # Papiex Makefile default is "--rm -it", but -it causes "not a TTY" error
      # Keep --rm for cleanup, remove -it for non-interactive mode
      DOCKER_RUN_OPTS: "--rm"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean all
        run: make --debug OS_TARGET=rocky-8 clean-all

      - name: Build epmt-dash
        run: make --debug OS_TARGET=rocky-8 epmt-dash

      - name: Build papiex-dist
        run: make --debug OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Build docker-dist
        run: make --debug OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" docker-dist

      - name: Build epmt-full-release
        run: make --debug OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" epmt-full-release

      - name: Build check-release image
        run: make --debug OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" build-check-release

      - name: Run check-release tests
        run: make --debug OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" check-release
