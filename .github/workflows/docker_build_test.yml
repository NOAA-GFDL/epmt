name: docker_build_test

on:
  pull_request:
  push:
    branches:
      - main

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  docker-build-rocky8:
    runs-on: ubuntu-latest
    env:
      # Override docker run options for non-interactive CI
      # Papiex Makefile default is "--rm -it", but -it causes "not a TTY" error
      # Keep --rm for cleanup, remove -it for non-interactive mode
      DOCKER_RUN_OPTS: "--rm"
      OS_TARGET: "rocky-8"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use docker driver to store images in local daemon
          # (docker-container driver requires --load and may not propagate errors)
          driver: docker

      - name: Clean all
        run: make --debug OS_TARGET=${OS_TARGET} clean-all

      - name: Build epmt-dash
        run: make --debug OS_TARGET=${OS_TARGET} epmt-dash

      - name: Build papiex-dist
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Build docker-dist
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" docker-dist

      - name: Build epmt-full-release
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" epmt-full-release

      - name: Build slurm-cluster base image
        run: |
          # The rocky-8-epmt-test-release Dockerfile expects slurm-cluster:21.08.6
          # which is not available on Docker Hub. Build it from giovtorres/slurm-docker-cluster tag 0.9.0
          # (Rocky Linux 8 based, builds Slurm 21.08.6 from source)
          set -e
          git clone --branch 0.9.0 --depth 1 https://github.com/giovtorres/slurm-docker-cluster.git /tmp/slurm-docker-cluster
          docker build --progress=plain -t slurm-cluster:21.08.6 /tmp/slurm-docker-cluster

      - name: Verify slurm-cluster image exists
        run: |
          if ! docker image inspect slurm-cluster:21.08.6 > /dev/null 2>&1; then
            echo "::error::Docker image 'slurm-cluster:21.08.6' was not built."
            exit 1
          fi
          echo "Image 'slurm-cluster:21.08.6' exists."

      - name: Build check-release image
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" build-check-release

      - name: Verify check-release image exists
        run: |
          # Extract EPMT_VERSION using the same sed logic as the Makefile (line 44)
          EPMT_VERSION=$(sed -n '/_version = /p' src/epmt/epmtlib.py | sed 's/ //g; s/,/./g; s/.*(\(.*\))/\1/')
          IMAGE="${OS_TARGET}-epmt-test-release:${EPMT_VERSION}"
          echo "Checking for Docker image: ${IMAGE}"
          if ! docker image inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "::error::Docker image '${IMAGE}' was not built. The build-check-release step likely failed silently."
            exit 1
          fi
          echo "Image '${IMAGE}' exists."

      - name: Run check-release tests
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" check-release
