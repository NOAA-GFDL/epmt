name: docker_build_test

on:
  pull_request:
  push:
    branches:
      - main

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

jobs:
  docker-build-rocky8:
    runs-on: ubuntu-latest
    # Use Docker-in-Docker (DinD) approach with privileged container
    services:
      dind:
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      # Connect to the DinD service
      DOCKER_HOST: tcp://localhost:2375
      # Override docker run options to be non-interactive for CI (remove -it flag)
      DOCKER_RUN_OPTS: "--rm"

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Docker daemon
        run: |
          # Wait for Docker daemon to be ready
          if ! timeout 60 sh -c 'until docker info; do sleep 1; done'; then
            echo "Error: Docker daemon did not become ready within 60 seconds"
            exit 1
          fi
          echo "Docker daemon is ready"

      - name: Clean all
        run: make OS_TARGET=rocky-8 clean-all

      - name: Build epmt-dash
        run: make OS_TARGET=rocky-8 epmt-dash

      - name: Build papiex-dist
        run: make OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Build docker-dist
        run: make OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" docker-dist

      - name: Build epmt-full-release
        run: make OS_TARGET=rocky-8 epmt-full-release

      - name: Build check-release image
        run: make OS_TARGET=rocky-8 build-check-release

      - name: Run check-release tests
        run: make OS_TARGET=rocky-8 DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" check-release
