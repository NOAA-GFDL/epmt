name: weekly_cache_builds

on:
  schedule:
    # Build and cache tarballs every Monday at 6am UTC so that PR runs can
    # restore them from cache and skip the expensive download/compile steps.
    - cron: '0 6 * * 1'
  ## DEBUG: uncomment these lines if one needs to run sooner, rather than later
  ## re-comment pre-merge
  # push:
  workflow_dispatch:

# cancel any in-progress run if a newer one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-slurm-image:
    runs-on: ubuntu-latest
    env:
      # Values from giovtorres/slurm-docker-cluster .env file.
      # docker build does not read .env files (only docker-compose does),
      # so we define these here and pass SLURM_TAG as --build-arg.
      SLURM_TAG: "slurm-25-05-3-1"
      IMAGE_TAG: "25.05.3"
      SLURM_CLUSTER_TAG: "0.9.0"

    steps:
      - uses: actions/checkout@v4

      # Always build from source to verify the image can still be built.
      # Cache key covers all version identifiers; bumping any one of them
      # produces a new key and forces a fresh build in docker_build_test.
      - name: Build slurm-cluster image
        run: |
          set -e
          git clone --branch ${{ env.SLURM_CLUSTER_TAG }} --depth 1 \
            https://github.com/giovtorres/slurm-docker-cluster.git \
            /tmp/slurm-docker-cluster
          docker build --progress=plain \
            --build-arg SLURM_TAG=${SLURM_TAG} \
            -t slurm-cluster:${IMAGE_TAG} \
            /tmp/slurm-docker-cluster

      - name: Verify slurm-cluster image exists
        run: |
          if ! docker image inspect slurm-cluster:${IMAGE_TAG} > /dev/null 2>&1; then
            echo "::error::Docker image 'slurm-cluster:${IMAGE_TAG}' was not built."
            exit 1
          fi
          echo "Image 'slurm-cluster:${IMAGE_TAG}' exists."

      - name: Save slurm-cluster image to tarball
        run: docker save slurm-cluster:${IMAGE_TAG} -o /tmp/slurm-cluster-image.tar

      # Save the freshly built image to cache.  docker_build_test restores
      # this cache on PR/push runs so the expensive SLURM build is skipped.
      # If the key already exists (same versions), the save is a no-op, but
      # the build above still ran and verified buildability.
      - name: Cache slurm-cluster image
        uses: actions/cache/save@v4
        with:
          path: /tmp/slurm-cluster-image.tar
          key: slurm-cluster-${{ env.IMAGE_TAG }}-${{ env.SLURM_TAG }}-v${{ env.SLURM_CLUSTER_TAG }}

  build-tarballs:
    runs-on: ubuntu-latest
    env:
      OS_TARGET: "rocky-8"
      # Override docker run options for non-interactive CI.
      # Papiex Makefile default is "--rm -it", but -it causes "not a TTY" error.
      DOCKER_RUN_OPTS: "--rm"
      # Tarball source identifiers — update these to invalidate their caches.
      PAPIEX_VERSION: "2.3.15"
      EPMT_DASH_SRC_BRANCH: "autopep8.poke"

    steps:
      - uses: actions/checkout@v4

      # ── epmt-dash ─────────────────────────────────────────────────────────
      # Downloads the epmt-dash UI tarball from GitHub and extracts it to
      # src/epmt/ui.  Always fetched fresh here to verify the URL is still
      # reachable; the resulting directory is cached for docker_build_test.
      #
      # Cache invalidation: update EPMT_DASH_SRC_BRANCH in the env section
      # above (and in the Makefile) when a different branch is needed.
      - name: Build epmt-dash
        run: make --debug OS_TARGET=${OS_TARGET} epmt-dash

      - name: Verify epmt-dash directory exists
        run: |
          if [ ! -d "src/epmt/ui" ]; then
            echo "::error::src/epmt/ui not found after epmt-dash build."
            exit 1
          fi
          echo "src/epmt/ui exists."

      # Save src/epmt/ui so docker_build_test can restore it and skip
      # the download+extraction entirely (make sees the target satisfied).
      - name: Cache epmt-dash
        uses: actions/cache/save@v4
        with:
          path: src/epmt/ui
          key: epmt-dash-${{ env.EPMT_DASH_SRC_BRANCH }}

      # ── papiex ────────────────────────────────────────────────────────────
      # Downloads papiex source and compiles it inside a Docker container,
      # producing papiex-epmt-{VERSION}-{OS_TARGET}.tgz.  Always built fresh
      # here to verify the build still works; the tarball is cached for
      # docker_build_test.
      #
      # Cache invalidation: update PAPIEX_VERSION in the env section above
      # (and in the Makefile) when a new papiex release is needed.
      - name: Build papiex-dist
        run: make --debug OS_TARGET=${OS_TARGET} DOCKER_RUN_OPTS="${DOCKER_RUN_OPTS}" papiex-dist

      - name: Verify papiex tarball exists
        run: |
          TARBALL="papiex-epmt-${PAPIEX_VERSION}-${OS_TARGET}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Papiex tarball '${TARBALL}' not found after build."
            exit 1
          fi
          echo "Papiex tarball '${TARBALL}' exists."

      # Save the compiled tarball so docker_build_test can restore it and
      # skip the Docker-based papiex compilation entirely.
      - name: Cache papiex tarball
        uses: actions/cache/save@v4
        with:
          path: papiex-epmt-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}.tgz
          key: papiex-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}

  # ── container-cached tarballs (for build_and_test_epmt) ───────────────
  # build_and_test_epmt runs inside a rockylinux:8 container, which gives
  # actions/cache a different workspace path (/__w/...) than the host
  # runner (/home/runner/work/...).  The cache version hash includes the
  # absolute path, so caches saved from a non-container job are invisible
  # to a container job (and vice-versa).  This job runs in the same kind
  # of container so its caches match what build_and_test_epmt expects.
  build-container-cached-tarballs:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
      options: --privileged
    env:
      OS_TARGET: "rocky-8"
      PAPIEX_VERSION: "2.3.15"
      EPMT_DASH_SRC_BRANCH: "autopep8.poke"
      # Build environment versions — must match Makefile and build_and_test_epmt.yml
      PYTHON_VERSION: "3.9.25"  # updated from 3.9.22 (issue #153: use latest 3.9.x)
      SQLITE_VERSION: "3490100"
      SQLITE_YEAR: "2025"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          yum update -y
          yum install -y make gcc gcc-c++ gcc-gfortran curl tar gzip unzip \
            findutils perl python3 procps-ng bind-utils tcsh tcl git \
            zlib-devel bzip2-devel readline-devel sqlite-devel openssl-devel \
            xz-devel libffi-devel

      # ── epmt-dash (container-path cache) ────────────────────────────
      # Same content as the build-tarballs job above, but saved from a
      # container context so build_and_test_epmt can restore it.
      - name: Build epmt-dash
        run: make epmt-dash

      - name: Verify epmt-dash directory exists
        run: |
          if [ ! -d "src/epmt/ui" ]; then
            echo "::error::src/epmt/ui not found after epmt-dash build."
            exit 1
          fi
          echo "src/epmt/ui exists."

      - name: Cache epmt-dash (container path)
        uses: actions/cache/save@v4
        with:
          path: src/epmt/ui
          key: epmt-dash-${{ env.EPMT_DASH_SRC_BRANCH }}

      # ── papiex (OUTSIDE_DOCKER) ────────────────────────────────────
      - name: Build papiex-dist (OUTSIDE_DOCKER)
        run: make OUTSIDE_DOCKER='YUP' papiex-dist

      - name: Verify papiex tarball exists
        run: |
          TARBALL="papiex-epmt-${PAPIEX_VERSION}-${OS_TARGET}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Papiex OUTSIDE_DOCKER tarball '${TARBALL}' not found."
            exit 1
          fi
          echo "Papiex OUTSIDE_DOCKER tarball '${TARBALL}' exists."

      - name: Cache papiex tarball (OUTSIDE_DOCKER)
        uses: actions/cache/save@v4
        with:
          path: papiex-epmt-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}.tgz
          key: papiex-outside-docker-${{ env.PAPIEX_VERSION }}-${{ env.OS_TARGET }}

      # ── Python + SQLite from source (container-path cache) ──────────
      # Pre-warm the Python/SQLite build cache so build_and_test_epmt
      # can skip the expensive compilation on most runs.
      - name: Build SQLite from source
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/python-sqlite/usr/lib64
          cd /usr/src
          curl -o sqlite-amalgamation-${{ env.SQLITE_VERSION }}.zip \
            https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-amalgamation-${{ env.SQLITE_VERSION }}.zip
          unzip sqlite-amalgamation-${{ env.SQLITE_VERSION }}.zip
          cd sqlite-amalgamation-${{ env.SQLITE_VERSION }}
          gcc -shared -fPIC -O2 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_LOAD_EXTENSION \
            -DSQLITE_MAX_VARIABLE_NUMBER=9999 sqlite3.c \
            -o $GITHUB_WORKSPACE/.cache/python-sqlite/usr/lib64/libsqlite3.so
          cp $GITHUB_WORKSPACE/.cache/python-sqlite/usr/lib64/libsqlite3.so /usr/lib64/libsqlite3.so
          ldconfig

      - name: Build Python from source
        run: |
          cd /usr/src
          curl -o Python-${{ env.PYTHON_VERSION }}.tgz \
            https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/Python-${{ env.PYTHON_VERSION }}.tgz
          tar xzf Python-${{ env.PYTHON_VERSION }}.tgz
          cd Python-${{ env.PYTHON_VERSION }}
          ./configure --quiet --prefix=/usr --enable-shared --enable-optimizations --enable-loadable-sqlite-extensions
          make --silent install DESTDIR=$GITHUB_WORKSPACE/.cache/python-sqlite > /dev/null

      - name: Verify Python build
        run: |
          cp -a .cache/python-sqlite/usr/* /usr/
          ldconfig
          python3 -V

      - name: Cache Python and SQLite build (container path)
        uses: actions/cache/save@v4
        with:
          path: .cache/python-sqlite
          key: python-sqlite-${{ env.PYTHON_VERSION }}-${{ env.SQLITE_VERSION }}-rocky8-v1
