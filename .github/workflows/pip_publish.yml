name: pip_publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipbuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Test artifact validation
        run: python -m unittest discover -s utils -p test_check_python_artifacts.py

      - name: Build epmt pip Package
        run: |
          make python-dist

      - name: Verify source and release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/epmt/epmtlib.py')['__version__'])")
          args=(--expected-version "$version")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          python utils/check_python_artifacts.py "${args[@]}"

      - name: Upload pip Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epmt-pip-packages
          path: dist/*
          if-no-files-found: error

  installed-tests:
    needs: pipbuild
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: epmt-pip-packages
          path: dist/
      - name: Install validation tooling
        run: python -m pip install packaging
      - name: Validate a fresh installed wheel outside the checkout
        run: python utils/check_python_artifacts.py --install

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [pipbuild, installed-tests]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: epmt-pip-packages
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
