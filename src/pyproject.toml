[build-system]
requires = [
	#"setuptools == 69.0.2"
    "setuptools >= 61, <69",
    "setuptools_scm[toml] >= 4, <6",
    "wheel >= 0.29.0"
]
build-backend = "setuptools.build_meta"

[project]
name            = "epmt"
version         = "4.11.0"
authors         = [ { name = "Minimal Metrics, LLC", email = "some.where@over.there" } ]
description     = "Experiment Performance Metrics Toolkit"
readme          = "README.md"
requires-python = "==3.9.22"
classifiers     = [ "Programming Language :: Python :: 3", ]
# Runtime dependencies: only packages directly imported by epmt at runtime.
# Transitive dependencies (e.g. Jinja2, Werkzeug, joblib) are resolved
# automatically by pip and should NOT be listed here.
dependencies = [
    "alembic",
    "Flask",
    "kneed",
    "numpy==1.26.4",
    "pandas==1.5.3",
    "plotly",
    "psycopg2-binary",
    "py-cpuinfo",
    "pyod",
    "python-daemon",
    "pytz",
    "scikit-learn",
    "scipy",
    "six",
    "SQLAlchemy==1.4.54",
]

[project.optional-dependencies]
# Interactive notebook / IPython shell support
notebook = [
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter",
    "jupyter-client",
    "jupyter-console",
    "jupyter-core",
    "notebook<7",
    "qtconsole",
]
# Dash-based web UI
ui = [
    "dash",
    "dash-bootstrap-components",
    "dash-daq",
    "dash-table",
]
# Documentation generation
docs = [
    "livereload",
    "mkdocs",
    "mkdocs-git-committers-plugin",
    "mkdocs-theme-bootstrap4",
]
# Linting and static analysis
dev = [
    "astroid",
    "isort",
    "lazy-object-proxy",
    "mccabe",
    "wrapt",
]
# Test runner
test = [
    "pytest",
]
# 20231102 caw: pyinstaller is pinned at 5.7.0, latest version doesn't allow the settings.py tactic.
build = [
    "pyinstaller==5.7.0",
    "pyinstaller-hooks-contrib==2023.11",
]
# Shorthand: install everything (mirrors the old flat dependency list)
all = [
    "epmt[notebook,ui,docs,dev,test,build]",
]

[project.urls]
"Homepage" = "https://gitlab.com/minimal-metrics-llc/epmt/epmt"
"Bug Tracker" = "https://gitlab.com/minimal-metrics-llc/epmt/epmt/-/issues"
