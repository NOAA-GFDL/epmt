[build-system]
requires = [
    "setuptools >= 61, <69",
    "wheel >= 0.29.0"
]
build-backend = "setuptools.build_meta"

[project]
name            = "epmt"
dynamic         = ["version"]
authors         = [ { name = "Minimal Metrics, LLC", email = "some.where@over.there" } ]
description     = "Experiment Performance Metrics Toolkit"
readme          = "README.md"
# Widened from ==3.9.* — supports 3.9/3.10/3.11.
# 3.12 requires upgrading pandas (1.5→2.x) and SQLAlchemy (1.4→2.x)
# which dropped distutils; tracked in issue #105.
requires-python = ">=3.9,<3.12"
classifiers     = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
# Runtime dependencies: only packages directly imported by epmt at runtime.
# Transitive dependencies (e.g. Jinja2, Werkzeug, joblib) are resolved
# automatically by pip and should NOT be listed here.
dependencies = [
    "alembic",
    "Flask",
    "kneed",
    "numpy==1.26.4",
    "pandas==1.5.3",
    "plotly",
    "psycopg2-binary",
    "py-cpuinfo",
    "pyod",
    "python-daemon",
    "pytz",
    "scikit-learn",
    "scipy",
    "six",
    "SQLAlchemy==1.4.54",
]

[project.optional-dependencies]
# Interactive notebook / IPython shell support
notebook = [
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter",
    "jupyter-client",
    "jupyter-console",
    "jupyter-core",
    "notebook<7",
    "qtconsole",
]
# Dash-based web UI
ui = [
    "dash",
    "dash-bootstrap-components",
    "dash-daq",
    "dash-table",
]
# Documentation generation
docs = [
    "livereload",
    "mkdocs",
    "mkdocs-git-committers-plugin",
    "mkdocs-theme-bootstrap4",
]
# Linting and static analysis
dev = [
    "astroid",
    "isort",
    "lazy-object-proxy",
    "mccabe",
    "wrapt",
]
# Test runner
test = [
    "pytest",
]
# 20231102 caw: pyinstaller is pinned at 5.7.0, latest version doesn't allow the settings.py tactic.
build = [
    "pyinstaller==5.7.0",
    "pyinstaller-hooks-contrib==2023.11",
]
# Shorthand: install everything (mirrors the old flat dependency list)
all = [
    "epmt[notebook,ui,docs,dev,test,build]",
]

[project.scripts]
epmt = "epmt.cli:main"

[project.urls]
"Homepage" = "https://gitlab.com/minimal-metrics-llc/epmt/epmt"
"Bug Tracker" = "https://gitlab.com/minimal-metrics-llc/epmt/epmt/-/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "epmt.epmtlib.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
epmt = [
    "lib/*.so*",

    "alembic.ini",
    "preset_settings/*.py",

    "epmt_migrations/README",
    "epmt_migrations/env.py",
    "epmt_migrations/script.py.mako",
    "epmt_migrations/docker-entrypoint-initdb.d/init-user-db.sh",
    "epmt_migrations/versions/*",

    "test/run",
    "test/test_run.sh",
    "test/test_source.csh",

    "test/data/corrupted_csv/*",
    "test/data/csv/*",
    "test/data/daemon/627919.tgz",
    "test/data/daemon/ingest/*",
    "test/data/misc/*",
    "test/data/outliers/*",
    "test/data/outliers_nb/*",
    "test/data/query/*",
    "test/data/query_notebook/*",
    "test/data/submit/692500.tgz",
    "test/data/submit/804268.tgz",
    "test/data/submit/804280.tgz",
    "test/data/submit/3455/*",
    "test/data/tsv/collated-tsv-2220.tgz",
    "test/data/tsv/12340/*",

    "test/integration/conftest.py",
    "test/integration/test_integration_*.py",
    "test/integration/epmt-annotate.sh",
    "test/integration/epmt-escape-workload.sh",

    "test/shell/*",
]
